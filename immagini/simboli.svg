<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    I SIMBOLI DEGLI INDIRIZZI, disegnati a mano.

    Ogni simbolo è un disegno a linee su un quadrato di 24 per 24.
    Il colore non è scritto qui: lo prende dalla pagina (currentColor),
    così lo stesso disegno va bene su qualunque fondo.

    Nelle pagine si richiamano così:
        <svg><use href="immagini/simboli.svg?v=1#rotella"></use></svg>
    Se si cambia un disegno, si aumenta il numero ?v= in js/home.js.
  -->

  <!-- Meccanica: una rotella dentata con il foro al centro -->
  <symbol id="rotella" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
    <path d="M10.11 4.43L10.54 1.6L13.46 1.6L13.89 4.43A7.8 7.8 0 0 1 16.02 5.31L18.32 3.61L20.39 5.68L18.69 7.98A7.8 7.8 0 0 1 19.57 10.11L22.4 10.54L22.4 13.46L19.57 13.89A7.8 7.8 0 0 1 18.69 16.02L20.39 18.32L18.32 20.39L16.02 18.69A7.8 7.8 0 0 1 13.89 19.57L13.46 22.4L10.54 22.4L10.11 19.57A7.8 7.8 0 0 1 7.98 18.69L5.68 20.39L3.61 18.32L5.31 16.02A7.8 7.8 0 0 1 4.43 13.89L1.6 13.46L1.6 10.54L4.43 10.11A7.8 7.8 0 0 1 5.31 7.98L3.61 5.68L5.68 3.61L7.98 5.31A7.8 7.8 0 0 1 10.11 4.43Z"/>
    <circle cx="12" cy="12" r="3.4"/>
  </symbol>

  <!-- Grafica: un occhio -->
  <symbol id="occhio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M1.8 12C4.6 7 8.1 4.8 12 4.8S19.4 7 22.2 12C19.4 17 15.9 19.2 12 19.2S4.6 17 1.8 12Z"/>
    <circle cx="12" cy="12" r="3.6"/>
    <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Liceo: una lampadina -->
  <symbol id="lampadina" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5A6.3 6.3 0 0 0 8.4 14C9.2 14.6 9.6 15.4 9.6 16.3V17H14.4V16.3C14.4 15.4 14.8 14.6 15.6 14A6.3 6.3 0 0 0 12 2.5Z"/>
    <path d="M9.6 19.5H14.4"/>
    <path d="M10.6 22H13.4"/>
  </symbol>

  <!-- Serali: una luna -->
  <symbol id="luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M20.5 14.2A8.6 8.6 0 1 1 9.8 3.5A7.4 7.4 0 0 0 20.5 14.2Z"/>
  </symbol>

  <!-- I SIMBOLI DEI CONTATTI -->

  <!-- Indirizzo: il segnaposto delle mappe -->
  <symbol id="luogo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M12 21.5C12 21.5 5 14.6 5 9.5A7 7 0 0 1 19 9.5C19 14.6 12 21.5 12 21.5Z"/>
    <circle cx="12" cy="9.5" r="2.6"/>
  </symbol>

  <!-- Telefono: una cornetta -->
  <symbol id="telefono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M6.5 3.5H9.5L11 8L8.8 9.6C9.9 11.9 12.1 14.1 14.4 15.2L16 13L20.5 14.5V17.5C20.5 19.2 19.2 20.5 17.5 20.5C10.3 20.1 3.9 13.7 3.5 6.5C3.5 4.8 4.8 3.5 6.5 3.5Z"/>
  </symbol>

  <!-- Email: una busta -->
  <symbol id="busta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13" rx="2"/>
    <path d="M3.5 6.5L12 13L20.5 6.5"/>
  </symbol>

  <!-- Sito: un globo -->
  <symbol id="globo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12H21"/>
    <path d="M12 3C14.6 5.6 15.8 8.6 15.8 12S14.6 18.4 12 21C9.4 18.4 8.2 15.4 8.2 12S9.4 5.6 12 3Z"/>
  </symbol>

  <!-- Open day: un calendario -->
  <symbol id="calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
    <path d="M3.5 10H20.5"/>
    <path d="M8 3V7"/>
    <path d="M16 3V7"/>
  </symbol>
</svg>
