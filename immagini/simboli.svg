<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    I SIMBOLI DEL SITO, disegnati a mano. Sono di due tipi.

    1. SIMBOLI "ADESIVO" per l'identità di indirizzi, serali e percorsi
       del liceo: figure piene con l'interno bianco e un contorno blu
       notte spesso, forme semplici e generose, come in un fumetto.
       Sono disegnati su un quadrato di 48 per 48. I due colori non sono
       scritti qui: li prendono dalla pagina (le variabili
       simbolo-interno e simbolo-contorno di stile.css), con il bianco e
       il blu notte come riserva. Così il bianco e il contorno scuro ci
       sono sempre, su qualunque fondo colorato.
       ATTENZIONE: nei commenti di questo file non si scrivono mai due
       trattini di seguito, altrimenti il browser scarta tutto il file.

    2. ICONE A LINEA per le funzioni (contatti, calendario): un solo
       colore, quello della pagina (currentColor), su un quadrato di 24.

    Nelle pagine si richiamano così:
        <svg><use href="immagini/simboli.svg?v=3#rotella"></use></svg>
    Se si cambia un disegno, si aumenta il numero ?v= in js/home.js.
  -->

  <!-- Meccanica: un ingranaggio con pochi denti larghi e il mozzo ben
       visibile, e uno più piccolo che ingrana -->
  <symbol id="rotella" viewBox="0 0 48 48">
    <g style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)" stroke-width="3.5" stroke-linejoin="round">
      <path d="M36.74 6.12L38.43 3.99L42.69 7.08L41.19 9.35A6.5 6.5 0 0 1 41.95 11.71L44.5 12.66L42.87 17.66L40.25 16.93A6.5 6.5 0 0 1 38.25 18.39L38.13 21.11L32.87 21.11L32.75 18.39A6.5 6.5 0 0 1 30.75 16.93L28.13 17.66L26.5 12.66L29.05 11.71A6.5 6.5 0 0 1 29.81 9.35L28.31 7.08L32.57 3.99L34.26 6.12A6.5 6.5 0 0 1 36.74 6.12Z"/>
      <path d="M14.52 16.83L14.73 12.56L23.27 12.56L23.48 16.83A12.5 12.5 0 0 1 26.87 18.79L30.67 16.83L34.94 24.23L31.35 26.54A12.5 12.5 0 0 1 31.35 30.46L34.94 32.77L30.67 40.17L26.87 38.21A12.5 12.5 0 0 1 23.48 40.17L23.27 44.44L14.73 44.44L14.52 40.17A12.5 12.5 0 0 1 11.13 38.21L7.33 40.17L3.06 32.77L6.65 30.46A12.5 12.5 0 0 1 6.65 26.54L3.06 24.23L7.33 16.83L11.13 18.79A12.5 12.5 0 0 1 14.52 16.83Z"/>
    </g>
    <!-- I mozzi: pieni, blu notte -->
    <circle cx="19" cy="28.5" r="4.2" style="fill: var(--simbolo-contorno, #00193C)"/>
    <circle cx="35.5" cy="12.5" r="2.4" style="fill: var(--simbolo-contorno, #00193C)"/>
  </symbol>

  <!-- Grafica: un occhio con l'iride piena e un riflesso -->
  <symbol id="occhio" viewBox="0 0 48 48">
    <path d="M3.5 24C10.5 11.5 37.5 11.5 44.5 24C37.5 36.5 10.5 36.5 3.5 24Z" stroke-width="3.5" stroke-linejoin="round" style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)"/>
    <circle cx="24" cy="24" r="8" style="fill: var(--simbolo-contorno, #00193C)"/>
    <circle cx="27" cy="21" r="2.6" style="fill: var(--simbolo-interno, #FFFFFF)"/>
  </symbol>

  <!-- Liceo: una lampadina con il filamento e l'attacco a righe -->
  <symbol id="lampadina" viewBox="0 0 48 48">
    <g style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M17 30C17 26.5 11.5 24 11.5 17.5A12.5 12.5 0 0 1 36.5 17.5C36.5 24 31 26.5 31 30Z"/>
      <rect x="16.5" y="30" width="15" height="10" rx="2"/>
    </g>
    <g style="fill: none; stroke: var(--simbolo-contorno, #00193C)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 30V25.5L22 21.5L24 25.5L26 21.5L28 25.5V30"/>
      <path d="M16.5 33.4H31.5"/>
      <path d="M16.5 36.7H31.5"/>
    </g>
    <path d="M20.5 40H27.5L26 44.5H22Z" stroke-width="2" stroke-linejoin="round" style="fill: var(--simbolo-contorno, #00193C); stroke: var(--simbolo-contorno, #00193C)"/>
  </symbol>

  <!-- Serali: una falce di luna con una piccola stella -->
  <symbol id="luna" viewBox="0 0 48 48">
    <g style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)" stroke-width="3.5" stroke-linejoin="round">
      <path d="M20.03 12.03A15 15 0 1 0 35.71 29.95A12 12 0 0 1 20.03 12.03Z"/>
      <path d="M39 3.5L40.88 7.91L45.66 8.34L42.04 11.49L43.11 16.16L39 13.7L34.89 16.16L35.96 11.49L32.34 8.34L37.12 7.91Z"/>
    </g>
  </symbol>


  <!-- ICONE A LINEA PER LE FUNZIONI -->

  <!-- Indirizzo: il segnaposto delle mappe -->
  <symbol id="luogo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <path d="M12 21.5C12 21.5 5 14.6 5 9.5A7 7 0 0 1 19 9.5C19 14.6 12 21.5 12 21.5Z"/>
    <circle cx="12" cy="9.5" r="2.6"/>
  </symbol>

  <!-- Telefono: una cornetta -->
  <symbol id="telefono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <path d="M6.5 3.5H9.5L11 8L8.8 9.6C9.9 11.9 12.1 14.1 14.4 15.2L16 13L20.5 14.5V17.5C20.5 19.2 19.2 20.5 17.5 20.5C10.3 20.1 3.9 13.7 3.5 6.5C3.5 4.8 4.8 3.5 6.5 3.5Z"/>
  </symbol>

  <!-- Email: una busta -->
  <symbol id="busta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13" rx="2"/>
    <path d="M3.5 6.5L12 13L20.5 6.5"/>
  </symbol>

  <!-- Sito: un globo -->
  <symbol id="globo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12H21"/>
    <path d="M12 3C14.6 5.6 15.8 8.6 15.8 12S14.6 18.4 12 21C9.4 18.4 8.2 15.4 8.2 12S9.4 5.6 12 3Z"/>
  </symbol>

  <!-- Turno libero: una spunta -->
  <symbol id="spunta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5L9.5 17.5L19.5 6.5"/>
  </symbol>

  <!-- Turno esaurito: una croce -->
  <symbol id="croce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
    <path d="M6 6L18 18"/>
    <path d="M18 6L6 18"/>
  </symbol>

  <!-- Calendario: oggi non usato nella home, resta per le pagine future -->
  <symbol id="calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
    <path d="M3.5 10H20.5"/>
    <path d="M8 3V7"/>
    <path d="M16 3V7"/>
  </symbol>
</svg>
