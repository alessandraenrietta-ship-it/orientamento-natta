<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    I SIMBOLI DEL SITO, disegnati a mano. Sono di due tipi.

    1. SIMBOLI DI IDENTITÀ per indirizzi, serali e percorsi del liceo:
       figure piene, forme semplici e generose, in bianco e blu notte.
       Sono disegnati su un quadrato di 48 per 48. I colori non sono
       scritti qui: li prendono dalla pagina (le variabili
       simbolo-interno, simbolo-contorno e simbolo-iride di stile.css),
       con il bianco, il blu notte e il blu come riserva.
       ATTENZIONE: nei commenti di questo file non si scrivono mai due
       trattini di seguito, altrimenti il browser scarta tutto il file.

    2. ICONE A LINEA per le funzioni (contatti, calendario): un solo
       colore, quello della pagina (currentColor), su un quadrato di 24.

    Nelle pagine si richiamano così:
        <svg><use href="immagini/simboli.svg?v=5#rotella"></use></svg>
    Se si cambia un disegno, si aumenta il numero ?v= in js/comuni.js.
  -->

  <!-- Meccanica: un ingranaggio blu notte con otto denti; al centro un
       anello bianco con un fulmine bianco, per l'energia -->
  <symbol id="rotella" viewBox="0 0 48 48">
    <g style="fill: var(--simbolo-contorno, #00193C)">
      <circle cx="24" cy="24" r="16.5"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(45 24 24)"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(90 24 24)"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(135 24 24)"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(180 24 24)"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(225 24 24)"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(270 24 24)"/>
      <rect x="20.25" y="2.5" width="7.5" height="9" rx="1.6" transform="rotate(315 24 24)"/>
    </g>
    <circle cx="24" cy="24" r="10" stroke-width="2.6" style="fill: none; stroke: var(--simbolo-interno, #FFFFFF)"/>
    <path d="M26.2 15.6L19.6 25.2H23.6L21.8 32.4L28.4 22.8H24.4Z" stroke-width="0.8" stroke-linejoin="round" style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-interno, #FFFFFF)"/>
  </symbol>

  <!-- Grafica: un occhio con l'iride blu, dentro il mirino di una
       macchina fotografica (quattro angoli bianchi) -->
  <symbol id="occhio" viewBox="0 0 48 48">
    <g style="fill: none; stroke: var(--simbolo-interno, #FFFFFF)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14V4H14"/>
      <path d="M34 4H44V14"/>
      <path d="M4 34V44H14"/>
      <path d="M34 44H44V34"/>
    </g>
    <path d="M8 24C14 13 34 13 40 24C34 35 14 35 8 24Z" stroke-width="2.8" stroke-linejoin="round" style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)"/>
    <circle cx="24" cy="24" r="7" stroke-width="2" style="fill: var(--simbolo-iride, #1F5FA8); stroke: var(--simbolo-contorno, #00193C)"/>
    <circle cx="24" cy="24" r="3.4" style="fill: var(--simbolo-contorno, #00193C)"/>
    <circle cx="26.4" cy="21.6" r="1.6" style="fill: var(--simbolo-interno, #FFFFFF)"/>
  </symbol>

  <!-- Liceo: una lampadina accesa, bianca con il contorno blu notte, il
       filamento a Y, l'attacco blu notte e cinque raggi bianchi -->
  <symbol id="lampadina" viewBox="0 0 48 48">
    <g style="fill: none; stroke: var(--simbolo-interno, #FFFFFF)" stroke-width="2.6" stroke-linecap="round">
      <path d="M24 1.5V5"/>
      <path d="M11 6L13.6 8.6"/>
      <path d="M37 6L34.4 8.6"/>
      <path d="M3.5 21H7.5"/>
      <path d="M40.5 21H44.5"/>
    </g>
    <path d="M17.5 33C17.5 29 12 27 12 21A12 12 0 0 1 36 21C36 27 30.5 29 30.5 33Z" stroke-width="3" stroke-linejoin="round" style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)"/>
    <path d="M24 32.5V26.5M24 26.5L20 22M24 26.5L28 22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="fill: none; stroke: var(--simbolo-contorno, #00193C)"/>
    <rect x="17" y="33" width="14" height="6.5" rx="1.8" style="fill: var(--simbolo-contorno, #00193C)"/>
    <path d="M19 36.2H29" stroke-width="1.4" stroke-linecap="round" style="fill: none; stroke: var(--simbolo-interno, #FFFFFF)"/>
    <path d="M20.5 39.5H27.5L26.2 43.5H21.8Z" style="fill: var(--simbolo-contorno, #00193C)"/>
  </symbol>

  <!-- Serali: una falce di luna con una piccola stella -->
  <symbol id="luna" viewBox="0 0 48 48">
    <g style="fill: var(--simbolo-interno, #FFFFFF); stroke: var(--simbolo-contorno, #00193C)" stroke-width="3.5" stroke-linejoin="round">
      <path d="M20.03 12.03A15 15 0 1 0 35.71 29.95A12 12 0 0 1 20.03 12.03Z"/>
      <path d="M39 3.5L40.88 7.91L45.66 8.34L42.04 11.49L43.11 16.16L39 13.7L34.89 16.16L35.96 11.49L32.34 8.34L37.12 7.91Z"/>
    </g>
  </symbol>


  <!-- ICONE A LINEA PER LE FUNZIONI -->

  <!-- Indirizzo: il segnaposto delle mappe -->
  <symbol id="luogo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <path d="M12 21.5C12 21.5 5 14.6 5 9.5A7 7 0 0 1 19 9.5C19 14.6 12 21.5 12 21.5Z"/>
    <circle cx="12" cy="9.5" r="2.6"/>
  </symbol>

  <!-- Telefono: una cornetta -->
  <symbol id="telefono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <path d="M6.5 3.5H9.5L11 8L8.8 9.6C9.9 11.9 12.1 14.1 14.4 15.2L16 13L20.5 14.5V17.5C20.5 19.2 19.2 20.5 17.5 20.5C10.3 20.1 3.9 13.7 3.5 6.5C3.5 4.8 4.8 3.5 6.5 3.5Z"/>
  </symbol>

  <!-- Email: una busta -->
  <symbol id="busta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13" rx="2"/>
    <path d="M3.5 6.5L12 13L20.5 6.5"/>
  </symbol>

  <!-- Sito: un globo -->
  <symbol id="globo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12H21"/>
    <path d="M12 3C14.6 5.6 15.8 8.6 15.8 12S14.6 18.4 12 21C9.4 18.4 8.2 15.4 8.2 12S9.4 5.6 12 3Z"/>
  </symbol>

  <!-- Turno libero: una spunta -->
  <symbol id="spunta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5L9.5 17.5L19.5 6.5"/>
  </symbol>

  <!-- Turno esaurito: una croce -->
  <symbol id="croce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
    <path d="M6 6L18 18"/>
    <path d="M18 6L6 18"/>
  </symbol>

  <!-- Calendario: oggi non usato nella home, resta per le pagine future -->
  <symbol id="calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
    <path d="M3.5 10H20.5"/>
    <path d="M8 3V7"/>
    <path d="M16 3V7"/>
  </symbol>
</svg>
