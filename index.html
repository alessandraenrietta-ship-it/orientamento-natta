<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TESTO MODIFICABILE: titolo della scheda del browser e descrizione
       che compare su Google e nelle anteprime quando si condivide il
       link. Stanno qui e non in contenuti/ perché devono esserci prima
       che la pagina legga i file di testo. -->
  <title>Orientamento | IIS Giulio Natta, Rivoli</title>
  <meta name="description" content="Indirizzi, open day e contatti dell'IIS Giulio Natta di Rivoli: istituto tecnico tecnologico, liceo scientifico e corsi serali per adulti.">

  <!-- BOZZA: chiede ai motori di ricerca di non mostrare questa pagina
       e di non seguirne i link. Va TOLTA quando il sito è approvato e
       si vuole che le famiglie lo trovino anche cercando su Google. -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Il numero dopo ?v= serve a far riscaricare il file quando cambia.
    Senza, il browser continua a usare per qualche minuto la copia
    vecchia e le modifiche non si vedono.
    QUANDO SI MODIFICA UN FILE .css O .js, SI AUMENTA IL NUMERO DI UNO
    in tutte le pagine che lo caricano.
  -->
  <link rel="stylesheet" href="stile.css?v=16">
  <link rel="icon" href="immagini/logo-natta.png">
</head>
<body>

  <a class="salta" href="#contenuto">Salta al contenuto</a>

  <!-- La testata: logo e nome della scuola -->
  <header class="fascia fascia-testata">
    <div class="fascia-interno testata-interno">
      <p class="marchio">
        <!-- Il logo con lo sfondo trasparente, direttamente sul verde
             scuro. alt vuoto: il nome della scuola è scritto subito
             accanto. -->
        <img class="logo-scuola" src="immagini/logo-natta.png" alt="" width="231" height="155">
        <span id="nome-scuola"></span>
      </p>
    </div>
  </header>

  <!-- Tutti i testi qui sotto arrivano dai file della cartella
       contenuti/: home.txt, comuni.txt e serali.txt. Il contenuto resta
       nascosto finché i testi non sono stati letti, così non si vedono
       titoli vuoti.
       Le fasce si alternano: verde, chiara, verde, chiara, verde. -->
  <main id="contenuto" tabindex="-1" hidden>

    <!-- Apertura: l'unica fascia con il testo centrato -->
    <section class="fascia fascia-verde fascia-apertura" aria-labelledby="titolo">
      <div class="fascia-interno">
        <p class="occhiello" id="occhiello"></p>
        <h1 class="titolo-sito" id="titolo"></h1>
        <p class="claim" id="claim"></p>
        <div class="presentazione" id="presentazione"></div>
        <!-- La riga per gli adulti (compare solo se c'è nel file) e i due
             pulsanti che portano alle fasce degli indirizzi e dei
             serali, più in basso in questa stessa pagina -->
        <p class="per-adulti" id="testo-adulti"></p>
        <p class="pulsanti">
          <a class="pulsante" id="pulsante-diurno" href="#titolo-indirizzi"></a>
          <a class="pulsante" id="pulsante-adulti" href="#titolo-serali"></a>
        </p>
      </div>
    </section>

    <!-- Gli open day subito dopo l'apertura: le date scadono, devono
         vedersi presto -->
    <section class="fascia fascia-chiara" aria-labelledby="titolo-open-day">
      <div class="fascia-interno">
        <h2 class="titolo-fascia" id="titolo-open-day"></h2>
        <p class="sottotitolo" id="open-day-nota"></p>
        <!-- Un'unica scheda: le date come foglietti da calendario e, in
             fondo, il pulsante per prenotare -->
        <div class="carta calendario">
          <ul class="date" id="elenco-open-day"></ul>
          <p class="calendario-fondo" id="prenotazione"></p>
        </div>
      </div>
    </section>

    <section class="fascia fascia-verde" aria-labelledby="titolo-indirizzi">
      <div class="fascia-interno">
        <!-- tabindex="-1": il titolo può ricevere il focus, ci arriva il
             pulsante "Dopo la terza media" dell'apertura -->
        <h2 class="titolo-fascia" id="titolo-indirizzi" tabindex="-1"></h2>
        <div class="schede" id="schede"></div>
      </div>
    </section>

    <!-- I corsi serali: una fascia tutta loro, separata dagli indirizzi
         del diurno, con una sola scheda costruita come quelle degli
         indirizzi. Il titolo può ricevere il focus (tabindex="-1"): ci
         arriva il pulsante dell'apertura. -->
    <section class="fascia fascia-chiara" aria-labelledby="titolo-serali">
      <div class="fascia-interno">
        <h2 class="titolo-fascia" id="titolo-serali" tabindex="-1"></h2>
        <div id="scheda-serali"></div>
      </div>
    </section>

    <section class="fascia fascia-verde" aria-labelledby="titolo-contatti">
      <div class="fascia-interno">
        <h2 class="titolo-fascia" id="titolo-contatti"></h2>
        <!-- Tre pulsanti d'azione: chiamare, scrivere, arrivare -->
        <ul class="azioni" id="elenco-contatti"></ul>
      </div>
    </section>

  </main>

  <!-- TESTO MODIFICABILE: compare solo se i file di testo non si
       possono leggere. -->
  <section class="fascia fascia-verde" id="avviso" hidden>
    <div class="fascia-interno">
      <h1 class="titolo-fascia">Orientamento I.I.S. Giulio Natta</h1>
      <p>Non riesco a caricare i testi di questa pagina.</p>
      <p>Se hai aperto il file dal computer con un doppio clic, usa invece
         <strong>anteprima.bat</strong>. Altrimenti ricarica la pagina, oppure
         visita il <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
    </div>
  </section>

  <!-- Se JavaScript è spento, la pagina non può leggere i testi -->
  <noscript>
    <section class="fascia fascia-verde">
      <div class="fascia-interno">
        <p>Per vedere questa pagina serve JavaScript attivo nel browser.
           In alternativa visita il
           <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
      </div>
    </section>
  </noscript>

  <!-- Il piede: i dati istituzionali della scuola -->
  <footer class="fascia fascia-piede">
    <div class="fascia-interno">
      <ul class="piede-voci" id="piede"></ul>
    </div>
  </footer>

  <script src="js/contenuti.js?v=2"></script>
  <script src="js/home.js?v=15"></script>
</body>
</html>
