<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TESTO MODIFICABILE: titolo della scheda del browser e descrizione
       che compare su Google e nelle anteprime quando si condivide il
       link. Stanno qui e non in contenuti/ perché devono esserci prima
       che la pagina legga i file di testo. -->
  <title>Orientamento | IIS Giulio Natta, Rivoli</title>
  <meta name="description" content="Indirizzi, open day e contatti dell'IIS Giulio Natta di Rivoli: istituto tecnico tecnologico, liceo scientifico e corsi serali per adulti.">

  <!-- BOZZA: chiede ai motori di ricerca di non mostrare questa pagina
       e di non seguirne i link. Va TOLTA quando il sito è approvato e
       si vuole che le famiglie lo trovino anche cercando su Google. -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Il numero dopo ?v= serve a far riscaricare il file quando cambia.
    Senza, il browser continua a usare per qualche minuto la copia
    vecchia e le modifiche non si vedono.
    QUANDO SI MODIFICA UN FILE .css O .js, SI AUMENTA IL NUMERO DI UNO
    in tutte le pagine che lo caricano.

    La home usa la grafica nuova, "a cartolina" (grafica.css). Le altre
    pagine usano ancora quella a fasce (stile.css), finché non si
    rifanno anche loro.
  -->
  <link rel="stylesheet" href="grafica.css?v=19">
  <link rel="icon" href="immagini/logo-natta.png">
</head>
<body>

  <a class="salta" href="#contenuto">Salta al contenuto</a>

  <!-- La testata: logo e nome della scuola, su fondo bianco -->
  <header class="testata">
    <div class="interno testata-interno">
      <p class="marchio">
        <!-- alt vuoto: il nome della scuola è scritto subito accanto -->
        <img class="logo-scuola" src="immagini/logo-natta.png" alt="" width="231" height="155">
        <span id="nome-scuola"></span>
      </p>
    </div>
  </header>

  <!-- Tutti i testi qui sotto arrivano dai file della cartella
       contenuti/: home.txt, comuni.txt e serali.txt. Il contenuto resta
       nascosto finché i testi non sono stati letti, così non si vedono
       titoli vuoti.
       Le sezioni sono tutte su fondo bianco, separate da un filetto
       grigio sottile. -->
  <main id="contenuto" tabindex="-1" hidden>

    <!-- Apertura: occhiello, titolo, il disegno delle tre linee e i
         due pulsanti -->
    <section class="sezione apertura" aria-labelledby="titolo">
      <div class="interno">
        <p class="occhiello" id="occhiello"></p>
        <!-- Il titolo che si gira: un solo h1 con le due frasi, in inglese
             e in italiano, una sul davanti e una sul retro. Il lettore di
             schermo le legge tutte e due. Toccando il titolo le due frasi
             si scambiano; nessun segno lo indica, per scelta. -->
        <div class="titolo-gira" id="titolo-gira">
          <h1 class="titolo-sito titolo-home" id="titolo">
            <span class="titolo-giro">
              <span class="titolo-faccia titolo-faccia-en" lang="en" id="titolo-inglese"></span>
              <span class="titolo-faccia titolo-faccia-it" id="titolo-italiano"></span>
            </span>
          </h1>
        </div>
        <div class="presentazione" id="presentazione"></div>
      </div>
      <!-- Il disegno della scuola con le tre linee degli indirizzi. Lo
           mette qui js/home.js, leggendo immagini/linee-scuola.svg. È
           solo decorativo: nascosto ai lettori di schermo. -->
      <div class="disegno" id="disegno" aria-hidden="true"></div>
      <div class="interno">
        <!-- La riga per gli adulti (compare solo se c'è nel file) e i due
             pulsanti che portano alle sezioni degli indirizzi e dei
             serali, più in basso in questa stessa pagina -->
        <p class="per-adulti" id="testo-adulti"></p>
        <p class="pulsanti">
          <a class="pulsante pulsante-pieno" id="pulsante-diurno" href="#titolo-indirizzi"></a>
          <a class="pulsante pulsante-vuoto" id="pulsante-adulti" href="#titolo-serali"></a>
        </p>
      </div>
    </section>

    <!-- Gli open day subito dopo l'apertura: le date scadono, devono
         vedersi presto. Le date passate il sito le nasconde da solo;
         quando non ne resta nessuna, js/home.js sposta questa sezione
         dopo gli indirizzi. -->
    <section class="sezione" id="sezione-open-day" aria-labelledby="titolo-open-day">
      <div class="interno">
        <h2 class="titolo-sezione" id="titolo-open-day"></h2>
        <!-- Una lista: per ogni data un foglietto da calendario e,
             accanto, il giorno della settimana con sotto i due turni.
             Poi la nota sui turni e il pulsante per prenotare. -->
        <ul class="date" id="elenco-open-day"></ul>
        <p class="nota" id="open-day-nota"></p>
        <p class="fondo-sezione" id="prenotazione"></p>
      </div>
    </section>

    <section class="sezione" id="sezione-indirizzi" aria-labelledby="titolo-indirizzi">
      <div class="interno">
        <!-- tabindex="-1": il titolo può ricevere il focus, ci arriva il
             pulsante "Dopo la terza media" dell'apertura -->
        <h2 class="titolo-sezione" id="titolo-indirizzi" tabindex="-1"></h2>
        <ul class="indirizzi" id="schede"></ul>
      </div>
    </section>

    <!-- I corsi serali, separati dagli indirizzi del diurno. Il titolo
         può ricevere il focus (tabindex="-1"): ci arriva il pulsante
         dell'apertura. -->
    <section class="sezione" aria-labelledby="titolo-serali">
      <div class="interno" id="serali">
        <h2 class="titolo-sezione" id="titolo-serali" tabindex="-1"></h2>
      </div>
    </section>

    <section class="sezione" aria-labelledby="titolo-contatti">
      <div class="interno">
        <h2 class="titolo-sezione" id="titolo-contatti"></h2>
        <!-- Tre azioni: chiamare, scrivere, arrivare. Sotto ognuna il
             dato, che si può selezionare e copiare. -->
        <ul class="contatti" id="elenco-contatti"></ul>
      </div>
    </section>

  </main>

  <!-- TESTO MODIFICABILE: compare solo se i file di testo non si
       possono leggere. -->
  <section class="sezione" id="avviso" hidden>
    <div class="interno">
      <h1 class="titolo-sezione">Orientamento IIS Giulio Natta</h1>
      <p>Non riesco a caricare i testi di questa pagina.</p>
      <p>Se hai aperto il file dal computer con un doppio clic, usa invece
         anteprima.bat. Altrimenti ricarica la pagina, oppure
         visita il <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
    </div>
  </section>

  <!-- Se JavaScript è spento, la pagina non può leggere i testi -->
  <noscript>
    <section class="sezione">
      <div class="interno">
        <p>Per vedere questa pagina serve JavaScript attivo nel browser.
           In alternativa visita il
           <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
      </div>
    </section>
  </noscript>

  <!-- Il piede: il timbro rotondo e, accanto, la riga per i docenti
       orientatori. I dati della scuola non ci sono, in nessuna pagina:
       ripetevano la sezione Contatti, subito sopra. -->
  <footer class="piede">
    <div class="interno piede-interno">
      <!-- Il timbro lo disegna js/home.js. È solo decorativo. -->
      <div class="timbro" id="timbro" aria-hidden="true"></div>
      <ul class="piede-voci" id="piede"></ul>
    </div>
  </footer>

  <script src="js/contenuti.js?v=2"></script>
  <script src="js/comuni.js?v=3"></script>
  <script src="js/grafica.js?v=10"></script>
  <script src="js/home.js?v=29"></script>
</body>
</html>
