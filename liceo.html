<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TESTO MODIFICABILE: titolo della scheda del browser e descrizione
       che compare su Google e nelle anteprime quando si condivide il
       link. -->
  <title>Liceo scientifico, opzione Scienze applicate | IIS Giulio Natta, Rivoli</title>
  <meta name="description" content="Il Liceo scientifico, opzione Scienze applicate dell'IIS Giulio Natta di Rivoli e i suoi tre percorsi: Scienze applicate, Liceo Matematico, Liceo Digitale.">

  <!-- BOZZA: chiede ai motori di ricerca di non mostrare questa pagina.
       Va TOLTA quando il sito è approvato. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- QUANDO SI MODIFICA UN FILE .css O .js, SI AUMENTA IL NUMERO ?v=
       DI UNO in tutte le pagine che lo caricano. -->
  <link rel="stylesheet" href="grafica.css?v=3">
  <link rel="icon" href="immagini/logo-natta.png">
</head>
<body>

  <a class="salta" href="#contenuto">Salta al contenuto</a>

  <!-- La testata: logo e nome della scuola, come nella home -->
  <header class="testata">
    <div class="interno testata-interno">
      <!-- Logo e nome sono un collegamento alla home. Il lettore di
           schermo sente anche "pagina iniziale" (TESTO MODIFICABILE). -->
      <p class="marchio">
        <a class="marchio-link" href="index.html">
          <img class="logo-scuola" src="immagini/logo-natta.png" alt="" width="231" height="155">
          <span class="marchio-nome" id="nome-scuola"></span><span class="solo-lettori">, pagina iniziale</span>
        </a>
      </p>
    </div>
  </header>

  <!-- Tutti i testi qui sotto arrivano da contenuti/liceo.txt; il claim
       da contenuti/home.txt. -->
  <main id="contenuto" tabindex="-1" hidden>

    <!-- Apertura, centrata: titolo su due righe, claim del liceo, il
         disegno della scuola nei tre toni dei percorsi, sottotitolo -->
    <section class="sezione apertura" aria-labelledby="titolo">
      <div class="interno">
        <p class="torna"><a href="index.html"><span aria-hidden="true">‹ </span><span id="torna"></span></a></p>
        <h1 class="titolo-sito titolo-liceo" id="titolo"></h1>
        <p class="claim-liceo" id="claim"></p>
      </div>
      <!-- Il disegno lo mette qui js/grafica.js; i blu dei percorsi li
           decide grafica.css. Solo decorativo. -->
      <div class="disegno disegno-liceo" id="disegno" aria-hidden="true"></div>
      <div class="interno">
        <p class="sottotitolo-liceo" id="sottotitolo"></p>
      </div>
    </section>

    <!-- I tre percorsi, come gli indirizzi della home: ognuno si clicca
         per intero -->
    <section class="sezione" aria-label="I tre percorsi">
      <div class="interno">
        <ul class="percorsi" id="percorsi"></ul>
      </div>
    </section>

  </main>

  <!-- TESTO MODIFICABILE: compare solo se i file di testo non si
       possono leggere. -->
  <section class="sezione" id="avviso" hidden>
    <div class="interno">
      <h1 class="titolo-sezione">Liceo scientifico, opzione Scienze applicate</h1>
      <p>Non riesco a caricare i testi di questa pagina.</p>
      <p>Se hai aperto il file dal computer con un doppio clic, usa invece
         anteprima.bat. Altrimenti ricarica la pagina, oppure
         visita il <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
    </div>
  </section>

  <noscript>
    <section class="sezione">
      <div class="interno">
        <p>Per vedere questa pagina serve JavaScript attivo nel browser.
           In alternativa visita il
           <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
      </div>
    </section>
  </noscript>

  <!-- Il piede, come nella home: il timbro rotondo e i dati della
       scuola. Il timbro è solo decorativo. -->
  <footer class="piede">
    <div class="interno piede-interno">
      <div class="timbro" id="timbro" aria-hidden="true"></div>
      <ul class="piede-voci" id="piede"></ul>
    </div>
  </footer>

  <script src="js/contenuti.js?v=2"></script>
  <script src="js/comuni.js?v=2"></script>
  <script src="js/grafica.js?v=1"></script>
  <script src="js/liceo.js?v=8"></script>
</body>
</html>
