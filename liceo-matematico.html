<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TESTO MODIFICABILE: titolo della scheda del browser e descrizione
       che compare su Google e nelle anteprime quando si condivide il
       link. -->
  <title>Liceo Matematico | IIS Giulio Natta, Rivoli</title>
  <meta name="description" content="Il Liceo Matematico dell'IIS Giulio Natta di Rivoli: Liceo scientifico, opzione Scienze applicate, con più ore di matematica. Il percorso, il quadro orario e che cosa fare dopo il diploma.">

  <!-- BOZZA: chiede ai motori di ricerca di non mostrare questa pagina.
       Va TOLTA quando il sito è approvato. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- QUANDO SI MODIFICA UN FILE .css O .js, SI AUMENTA IL NUMERO ?v=
       DI UNO in tutte le pagine che lo caricano. -->
  <link rel="stylesheet" href="grafica.css?v=17">
  <link rel="icon" href="immagini/logo-natta.png">
</head>
<!-- Le tre pagine dei percorsi sono uguali: cambiano solo il titolo qui
     sopra e l'attributo qui sotto, che dice quale sezione di
     contenuti/liceo.txt leggere. Le ore in più del percorso stanno nella
     tabella PERCORSI di liceo.txt. -->
<body data-percorso="LICEO MATEMATICO">

  <a class="salta" href="#contenuto">Salta al contenuto</a>

  <!-- La testata: logo e nome della scuola, come nella home -->
  <header class="testata">
    <div class="interno testata-interno">
      <!-- Logo e nome sono un collegamento alla home. Il lettore di
           schermo sente anche "pagina iniziale" (TESTO MODIFICABILE). -->
      <p class="marchio">
        <a class="marchio-link" href="index.html">
          <img class="logo-scuola" src="immagini/logo-natta.png" alt="" width="231" height="155">
          <span class="marchio-nome" id="nome-scuola"></span><span class="solo-lettori">, pagina iniziale</span>
        </a>
      </p>
    </div>
  </header>

  <!-- Tutti i testi qui sotto arrivano da contenuti/liceo.txt -->
  <main id="contenuto" tabindex="-1" hidden>

    <!-- Apertura, centrata: occhiello grigio, nome del percorso, poi la
         spiegazione allineata a sinistra -->
    <section class="sezione apertura apertura-percorso" aria-labelledby="titolo">
      <div class="interno">
        <p class="torna"><a href="liceo.html"><span aria-hidden="true">‹ </span><span id="torna"></span></a></p>
        <p class="occhiello" id="etichetta"></p>
        <h1 class="titolo-sito" id="titolo"></h1>
        <p class="spiegazione" id="spiegazione"></p>
      </div>
    </section>

    <!-- Che cosa si impara, Come si studia, A chi si rivolge: tre parti
         con il titolo in verde. Una parte senza testo non compare; se non
         ce n'è nessuna, non compare la sezione. -->
    <section class="sezione" aria-label="Il percorso">
      <div class="interno">
        <div class="blocchi" id="blocchi"></div>
      </div>
    </section>

    <section class="sezione" aria-labelledby="titolo-quadro">
      <div class="interno">
        <h2 class="titolo-sezione" id="titolo-quadro"></h2>
        <table class="orario" id="orario"></table>
        <!-- Il pulsante verso "Le ore a confronto" della pagina del liceo -->
        <p class="fondo-sezione"><a class="pulsante pulsante-vuoto" id="confronta" href="liceo.html#confronto"></a></p>
      </div>
    </section>

    <section class="sezione" aria-labelledby="titolo-dopo">
      <div class="interno">
        <h2 class="titolo-sezione" id="titolo-dopo"></h2>
        <p class="testo-sezione" id="dopo-il-diploma"></p>
      </div>
    </section>

    <!-- Vieni a trovarci: i foglietti delle date, la nota sui turni e il
         pulsante per prenotare un open day, presi da comuni.txt come
         nella home (se non resta nessuna data, solo la frase
         "nessuna-data", senza foglietti né pulsante). Sotto, i
         collegamenti agli altri due percorsi. -->
    <section class="sezione" aria-labelledby="titolo-visita">
      <div class="interno">
        <h2 class="titolo-sezione" id="titolo-visita"></h2>
        <!-- I foglietti delle date, come nella home -->
        <ul class="date" id="date-visita"></ul>
        <p class="nota" id="nota-visita"></p>
        <p class="fondo-sezione" id="prenota-visita"></p>
        <nav class="altri-percorsi" id="altri-percorsi" aria-labelledby="titolo-altri">
          <p class="altri-titolo" id="titolo-altri"></p>
          <ul class="altri-elenco" id="elenco-altri"></ul>
        </nav>
      </div>
    </section>
  </main>

  <!-- TESTO MODIFICABILE: compare solo se i file di testo non si
       possono leggere. -->
  <section class="sezione" id="avviso" hidden>
    <div class="interno">
      <h1 class="titolo-sezione">Liceo Matematico</h1>
      <p>Non riesco a caricare i testi di questa pagina.</p>
      <p>Se hai aperto il file dal computer con un doppio clic, usa invece
         anteprima.bat. Altrimenti ricarica la pagina, oppure
         visita il <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
    </div>
  </section>

  <noscript>
    <section class="sezione">
      <div class="interno">
        <p>Per vedere questa pagina serve JavaScript attivo nel browser.
           In alternativa visita il
           <a href="https://www.itisgiulionatta.it">sito della scuola</a>.</p>
      </div>
    </section>
  </noscript>

  <!-- Il piede, come nella home: il timbro rotondo e la riga per i
       docenti orientatori. I dati della scuola non ci sono più (27
       ottobre 2026 sera). Il timbro è solo decorativo. -->
  <footer class="piede">
    <div class="interno piede-interno">
      <div class="timbro" id="timbro" aria-hidden="true"></div>
      <ul class="piede-voci" id="piede"></ul>
    </div>
  </footer>

  <script src="js/contenuti.js?v=2"></script>
  <script src="js/comuni.js?v=3"></script>
  <script src="js/grafica.js?v=9"></script>
  <script src="js/liceo.js?v=12"></script>
</body>
</html>
